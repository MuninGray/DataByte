services:
  db:
    image: mysql:8.0
    container_name: databyte_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: DataByte
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./dump/DataByte-1-1.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  api_usuarios:
    build: ./API_Usuarios
    container_name: databyte_api_usuarios
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: DataByte
      DB_USER: root
      DB_PASSWORD: root
    ports:
      - "8001:80"
    depends_on:
      db:
        condition: service_healthy

  api_gestion:
    build: ./API_Gestion
    container_name: databyte_api_gestion
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: DataByte
      DB_USER: root
      DB_PASSWORD: root
    ports:
      - "8002:80"
    depends_on:
      db:
        condition: service_healthy

  api_recoleccion:
    build: ./API_Recoleccion
    container_name: databyte_api_recoleccion
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: DataByte
      DB_USER: root
      DB_PASSWORD: root
    ports:
      - "8003:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
