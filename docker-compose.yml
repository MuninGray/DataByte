name: databyte-esi
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configurar MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: DataByte
      MYSQL_USER: ${DB_USER:?Configurar DB_USER en .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Configurar DB_PASSWORD en .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./dump/DataByte-1-1.sql:/docker-entrypoint-initdb.d/01-databyte.sql:ro
    networks: [databyte-internal]
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -uroot --silent']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  databyte-web:
    build:
      context: .
      dockerfile: Dockerfile.web.esi
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api-usuarios: {condition: service_started}
      api-gestion: {condition: service_started}
      api-recoleccion: {condition: service_started}
    networks: [databyte-internal]
    restart: unless-stopped

  api-usuarios:
    build:
      context: .
      dockerfile: Dockerfile.api-usuarios
    environment: &db_env
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: DataByte
      DB_USER: ${DB_USER:?Configurar DB_USER en .env}
      DB_PASSWORD: ${DB_PASSWORD:?Configurar DB_PASSWORD en .env}
      DATA_BYTE_ADMIN_SECRET: ${DATA_BYTE_ADMIN_SECRET:?Configurar DATA_BYTE_ADMIN_SECRET en .env}
    expose: ["80"]
    volumes:
      - usuarios-sessions:/var/lib/php/sessions
    depends_on:
      db: {condition: service_healthy}
    networks: [databyte-internal]
    restart: unless-stopped

  api-gestion:
    build:
      context: .
      dockerfile: Dockerfile.api-gestion
    environment: *db_env
    expose: ["80"]
    depends_on:
      db: {condition: service_healthy}
    networks: [databyte-internal]
    restart: unless-stopped

  api-recoleccion:
    build:
      context: .
      dockerfile: Dockerfile.api-recoleccion
    environment: *db_env
    expose: ["80"]
    depends_on:
      db: {condition: service_healthy}
    networks: [databyte-internal]
    restart: unless-stopped

  backup:
    image: mysql:8.0
    profiles: [backup]
    environment:
      DB_HOST: db
      DB_NAME: DataByte
      DB_USER: root
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD:?Configurar MYSQL_ROOT_PASSWORD en .env}
    volumes:
      - ./docker/backup/backup.sh:/usr/local/bin/backup.sh:ro
      - ./respaldos:/respaldos
    entrypoint: ["bash", "/usr/local/bin/backup.sh"]
    depends_on:
      db: {condition: service_healthy}
    networks: [databyte-internal]

networks:
  databyte-internal:
    driver: bridge
volumes:
  mysql-data:
  usuarios-sessions:
