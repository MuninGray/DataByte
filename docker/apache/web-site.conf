<VirtualHost *:80>
    ServerName 192.168.1.50
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L,NE]
</VirtualHost>

<VirtualHost *:443>
    ServerName 192.168.1.50
    DocumentRoot /var/www/html

    SSLEngine on
    RewriteEngine On    
    SSLCertificateFile /etc/apache2/certs/server.crt
    SSLCertificateKeyFile /etc/apache2/certs/server.key

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass        /API_Usuarios/public/  http://api-usuarios/
    ProxyPassReverse /API_Usuarios/public/  http://api-usuarios/
    ProxyPass        /API_Gestion/public/  http://api-gestion/
    ProxyPassReverse /API_Gestion/public/  http://api-gestion/
    ProxyPass        /API_Recoleccion/public/  http://api-recoleccion/
    ProxyPassReverse /API_Recoleccion/public/  http://api-recoleccion/

    RewriteRule ^/$ /Landing\ page/LandingPage/DataByte_LandingPage/LandingPage.html [R=302,L]
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
