<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | DataByte</title>
    <link rel="stylesheet" href="LandingPageLogin.css?v=green-auth-1">
</head>

<script>
    function setFieldError(inputId, message) {
        const input = document.getElementById(inputId);
        if (!input) return;

        input.style.borderColor = '#d93025';
        input.style.boxShadow = '0 0 0 1px rgba(217, 48, 37, 0.12)';
        input.setAttribute('aria-invalid', 'true');
        input.dataset.error = message || '';
    }

    function clearFieldError(inputId) {
        const input = document.getElementById(inputId);
        if (!input) return;

        input.style.borderColor = '';
        input.style.boxShadow = '';
        input.removeAttribute('aria-invalid');
        delete input.dataset.error;
    }

    document.addEventListener('DOMContentLoaded', function () {
        const form = document.getElementById('formLogin');
        const mensaje = document.getElementById('mensajeLogin');

        if (!form || !mensaje) return;

        const ciInput = document.getElementById('CI');
        const passInput = document.getElementById('contrasena');

        [ciInput, passInput].forEach(input => {
            if (!input) return;
            input.addEventListener('input', () => clearFieldError(input.id));
        });

        form.addEventListener('submit', async function (event) {
            event.preventDefault();

            const ci = document.getElementById('CI').value.trim();
            const contrasena = document.getElementById('contrasena').value.trim();

            clearFieldError('CI');
            clearFieldError('contrasena');

            if (!ci) {
                setFieldError('CI', 'La cédula es obligatoria.');
                mensaje.textContent = 'La cédula es obligatoria.';
                mensaje.style.color = 'red';
                return;
            }

            if (!contrasena) {
                setFieldError('contrasena', 'La contraseña es obligatoria.');
                mensaje.textContent = 'La contraseña es obligatoria.';
                mensaje.style.color = 'red';
                return;
            }

            if (!/^\d{8,}$/.test(ci)) {
                setFieldError('CI', 'La cédula debe contener solo dígitos y tener al menos 8.');
                mensaje.textContent = 'La cédula debe contener solo dígitos y tener al menos 8.';
                mensaje.style.color = 'red';
                return;
            }

            if (contrasena.length < 6) {
                setFieldError('contrasena', 'La contraseña debe tener al menos 6 caracteres.');
                mensaje.textContent = 'La contraseña debe tener al menos 6 caracteres.';
                mensaje.style.color = 'red';
                return;
            }

            try {
                const apiUrl = new URL('../../API_Usuarios/public/index.php?accion=login', window.location.href).toString();
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ CI: ci, contrasena: contrasena })
                });

                const data = await response.json();

                if (response.ok) {
                    mensaje.textContent = data.message || 'Login correcto.';
                    mensaje.style.color = 'green';

                    const rolRaw = String(data.usuario?.rol || '').trim();
                    const rol = rolRaw.toUpperCase().replace(/[\s_-]+/g, '_');
                    const rutasPorRol = {
                        ADMIN: '../Interfaces/InterfazAdmin.html',
                        USUARIO: '../LandingPage/DataByte_LandingPage/LandingPage.html',
                        INSPECTOR: '../Interfaces/InterfazInspector.html',
                        PEON: '../Interfaces/InterfazOpCuadrilla.html',
                        CHOFER: '../Interfaces/InterfazOpCuadrilla.html',
                        OPERARIO_ESTABLECIMIENTO: '../Interfaces/InterfazOpEstablecimiento.html'
                    };

                    const rutaDestino = rutasPorRol[rol]
                        || rutasPorRol[rolRaw.toUpperCase()]
                        || (['CHOFER', 'PEON'].includes(rolRaw.toUpperCase()) ? '../Interfaces/InterfazOpCuadrilla.html' : null);

                    if (rutaDestino) {
                        window.location.href = rutaDestino;
                    } else {
                        mensaje.textContent = 'Rol no reconocido: ' + (data.usuario?.rol || '');
                        mensaje.style.color = 'orange';
                    }
                } else {
                    mensaje.textContent = data.message || 'No se pudo iniciar sesión.';
                    mensaje.style.color = 'red';
                }
            } catch (error) {
                mensaje.textContent = 'Error de conexión con la API.';
                mensaje.style.color = 'red';
            }
        });
    });
</script>

<body>
    <!-- Contenedor para login -->
    <div class="contenedor_login">

        <h1>Iniciar sesión</h1>
        <form id="formLogin" novalidate>
            <!-- Etiqueta de Cedula de identidad para el logear -->
            <label for="CI">CI:</label>
            <input type="text" name="CI" id="CI" required><br><br>

            <!-- Etiqueta de contraseña para el logear -->
            <label for="contrasena">Contraseña:</label>
            <input type="password" name="contrasena" id="contrasena" required><br><br>

            <button type="submit" id="btnLogin">Entrar a mi cuenta</button>
        </form>

        <div id="mensajeLogin" style="margin-top: 10px;"></div>
        <!-- Boton que te redirige a la landing page -->
        <a href="../LandingPage/LandingPage.html">Volver al inicio</a>
    </div>

</body>
</html>
