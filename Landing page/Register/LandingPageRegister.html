<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | DataByte</title>
    <link rel="stylesheet" href="LandingPageRegister.css?v=green-auth-1">
</head>

<script>
    function setFieldError(inputId, message) {
        const input = document.getElementById(inputId);
        if (!input) return;

        input.style.borderColor = '#d93025';
        input.style.boxShadow = '0 0 0 1px rgba(217, 48, 37, 0.12)';
        input.setAttribute('aria-invalid', 'true');
        input.dataset.error = message || '';
    }

    function clearFieldError(inputId) {
        const input = document.getElementById(inputId);
        if (!input) return;

        input.style.borderColor = '';
        input.style.boxShadow = '';
        input.removeAttribute('aria-invalid');
        delete input.dataset.error;
    }

    document.addEventListener('DOMContentLoaded', function () {
        const form = document.getElementById('formRegistro');
        const mensaje = document.getElementById('mensajeRegistro');

        if (!form || !mensaje) return;

        const campos = ['correo', 'primerNombre', 'primerApellido', 'CI', 'contrasena', 'conf_contrasena'];
        campos.forEach(id => {
            const input = document.getElementById(id);
            if (input) {
                input.addEventListener('input', () => clearFieldError(id));
            }
        });

        form.addEventListener('submit', async function (event) {
            event.preventDefault();

            const correo = document.getElementById('correo').value.trim();
            const primerNombre = document.getElementById('primerNombre').value.trim();
            const primerApellido = document.getElementById('primerApellido').value.trim();
            const ci = document.getElementById('CI').value.trim();
            const contrasena = document.getElementById('contrasena').value.trim();
            const confContrasena = document.getElementById('conf_contrasena').value.trim();

            campos.forEach(clearFieldError);

            if (!correo) {
                setFieldError('correo', 'El correo es obligatorio.');
                mensaje.textContent = 'El correo es obligatorio.';
                mensaje.style.color = 'red';
                return;
            }

            if (!primerNombre) {
                setFieldError('primerNombre', 'El nombre es obligatorio.');
                mensaje.textContent = 'El nombre es obligatorio.';
                mensaje.style.color = 'red';
                return;
            }

            if (!primerApellido) {
                setFieldError('primerApellido', 'El apellido es obligatorio.');
                mensaje.textContent = 'El apellido es obligatorio.';
                mensaje.style.color = 'red';
                return;
            }

            if (!ci) {
                setFieldError('CI', 'La cédula es obligatoria.');
                mensaje.textContent = 'La cédula es obligatoria.';
                mensaje.style.color = 'red';
                return;
            }

            if (!contrasena) {
                setFieldError('contrasena', 'La contraseña es obligatoria.');
                mensaje.textContent = 'La contraseña es obligatoria.';
                mensaje.style.color = 'red';
                return;
            }

            if (!confContrasena) {
                setFieldError('conf_contrasena', 'Debés confirmar la contraseña.');
                mensaje.textContent = 'Debés confirmar la contraseña.';
                mensaje.style.color = 'red';
                return;
            }

            const emailValido = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo);
            if (!emailValido) {
                setFieldError('correo', 'Ingresá un correo electrónico válido.');
                mensaje.textContent = 'Ingresá un correo electrónico válido.';
                mensaje.style.color = 'red';
                return;
            }

            if (primerNombre.length < 2 || primerApellido.length < 2) {
                if (primerNombre.length < 2) setFieldError('primerNombre', 'El nombre debe tener al menos 2 caracteres.');
                if (primerApellido.length < 2) setFieldError('primerApellido', 'El apellido debe tener al menos 2 caracteres.');
                mensaje.textContent = 'El nombre y el apellido deben tener al menos 2 caracteres.';
                mensaje.style.color = 'red';
                return;
            }

            if (!/^\d{8,}$/.test(ci)) {
                setFieldError('CI', 'La cédula debe contener solo dígitos y tener al menos 8.');
                mensaje.textContent = 'La cédula debe contener solo dígitos y tener al menos 8.';
                mensaje.style.color = 'red';
                return;
            }

            if (contrasena.length < 6) {
                setFieldError('contrasena', 'La contraseña debe tener al menos 6 caracteres.');
                mensaje.textContent = 'La contraseña debe tener al menos 6 caracteres.';
                mensaje.style.color = 'red';
                return;
            }

            if (contrasena !== confContrasena) {
                setFieldError('contrasena', 'Las contraseñas no coinciden.');
                setFieldError('conf_contrasena', 'Las contraseñas no coinciden.');
                mensaje.textContent = 'Las contraseñas no coinciden.';
                mensaje.style.color = 'red';
                return;
            }

            try {
                const apiUrl = new URL('../../API_Usuarios/public/index.php', window.location.href).toString();
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        correo, 
                        PrNom: primerNombre, 
                        PrApel: primerApellido, 
                        CI: ci, 
                        contrasena, 
                        conf_contrasena: confContrasena 
                    })
                });

                const data = await response.json().catch(() => ({}));

                if (response.ok) {
                    mensaje.textContent = data.message || 'Usuario creado correctamente.';
                    mensaje.style.color = 'green';

                    setTimeout(() => {
                        window.location.href = '../LandingPage/DataByte_LandingPage/LandingPage.html';
                    }, 2000);
                } else {
                    mensaje.textContent = data.message || data.detail || 'No se pudo registrar el usuario.';
                    mensaje.style.color = 'red';
                }
            } catch (error) {
                mensaje.textContent = 'Error de conexión con la API.';
                mensaje.style.color = 'red';
            }
        });

    });
</script>

<body>
    <!-- Contenedor para register -->
    <div class="contenedor_register">

        <h1>Crear una cuenta</h1>
        <form id="formRegistro" novalidate>
            <!-- Etiqueta de correo para el registrar -->
            <label for="correo">Correo:</label>
            <input type="email" name="correo" id="correo" required><br><br>

            <!-- Etiqueta de primer nombre para el registrar -->
            <label for="primerNombre">Primer Nombre:</label>
            <input type="text" name="primerNombre" id="primerNombre" required><br><br>

            <!-- Etiqueta de primer apellido para el registrar -->
            <label for="primerApellido">Primer Apellido:</label>
            <input type="text" name="primerApellido" id="primerApellido" required><br><br>

            <!-- Etiqueta de Cedula de identidad para el registrar -->
            <label for="CI">CI:</label>
            <input type="text" name="CI" id="CI" required><br><br>

            <!-- Etiqueta de contraseña para el registrar -->
            <label for="contrasena">Contraseña:</label>
            <input type="password" name="contrasena" id="contrasena" required><br><br>

            <!-- Etiqueta de confirmar contraseña para el registrar -->
            <label for="conf_contrasena">Confirmar contraseña:</label>
            <input type="password" name="conf_contrasena" id="conf_contrasena" required><br><br>

            <button type="submit" id="btnRegistrar">Crear cuenta</button>
        </form>

        <div id="mensajeRegistro" style="margin-top: 10px;"></div>
        <!-- Boton que te redirige a la landing page -->
        <a href="../LandingPage/LandingPage.html">Volver al inicio</a>

    </div>

</body>
</html>
